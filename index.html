    <!-- MANA PWA SERVICE WORKER -->
    <script>
      (() => {
        const BASE_PATH = "/pwa-mana/";

        const isProduction =
          window.location.hostname === "sedyrakt.github.io" &&
          (
            window.location.pathname === "/pwa-mana" ||
            window.location.pathname.startsWith(BASE_PATH)
          );

        // Tsy mampandeha Service Worker amin'ny localhost
        // na amin'ny Development Mode Expo.
        if (
          !isProduction ||
          !("serviceWorker" in navigator) ||
          !window.isSecureContext
        ) {
          console.log(
            "MANA: Service Worker disabled in development mode."
          );
          return;
        }

        window.addEventListener("load", async () => {
          try {
            const registration =
              await navigator.serviceWorker.register(
                BASE_PATH + "sw.js",
                {
                  scope: BASE_PATH,
                  updateViaCache: "none"
                }
              );

            console.log(
              "MANA PWA Service Worker registered:",
              registration.scope
            );

            // Mitady version vaovao.
            await registration.update();

          } catch (error) {
            console.error(
              "MANA PWA Service Worker registration failed:",
              error
            );
          }
        });
      })();
    </script>
